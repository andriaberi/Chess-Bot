name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an older pull request run when new commits are pushed to it; runs on main finish, so each is released
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check
        run: make check

  # Each push to main that passes the checks is released, its version bumped by the commits
  # since the last tag: "feat!:" or a "BREAKING CHANGE:" line bumps major, "feat:" minor,
  # anything else patch; only docs/chore/ci/test/refactor/style/build commits release nothing.
  # With no tag yet, the release is 1.0.0.
  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Number the release
        id: number
        run: |
          if [ -n "$(git tag --points-at HEAD --list 'v*')" ]; then
            echo "This commit is released already."
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$previous" ]; then
            version=1.0.0
          else
            subjects=$(git log --format=%s "$previous..HEAD")
            if git log --format=%s%n%b "$previous..HEAD" | grep -qE '^[a-z]+(\(.*\))?!:|^BREAKING[ -]CHANGE:'; then
              bump=major
            elif grep -qE '^feat(\(.*\))?:' <<< "$subjects"; then
              bump=minor
            elif grep -qvE '^(docs|chore|ci|test|refactor|style|build)(\(.*\))?:' <<< "$subjects"; then
              bump=patch
            else
              echo "Only docs, chores and the like since $previous: nothing to release."
              exit 0
            fi
            IFS=. read -r major minor patch <<< "${previous#v}"
            case $bump in
              major) version=$((major + 1)).0.0 ;;
              minor) version=$major.$((minor + 1)).0 ;;
              patch) version=$major.$minor.$((patch + 1)) ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"

      # The build stamps its version from the nearest tag, so tag first; the release pushes the tag
      - name: Package
        if: steps.number.outputs.version
        env:
          VERSION: ${{ steps.number.outputs.version }}
        run: |
          git tag "v$VERSION"
          for rid in linux-x64 win-x64 osx-x64 osx-arm64; do
            make publish RID=$rid
            if [ "$rid" = win-x64 ]; then
              (cd dist && zip -qr "chess-bot-$VERSION-$rid.zip" "chess-bot-$rid")
            else
              tar -czf "dist/chess-bot-$VERSION-$rid.tar.gz" -C dist "chess-bot-$rid"
            fi
          done

      - name: Release
        if: steps.number.outputs.version
        env:
          VERSION: ${{ steps.number.outputs.version }}
          PREVIOUS: ${{ steps.number.outputs.previous }}
        run: |
          if [ -n "$PREVIOUS" ]; then
            git log --format='- %s' "$PREVIOUS..HEAD" > notes.md
          else
            echo "- The first release." > notes.md
          fi
          gh release create "v$VERSION" dist/*.tar.gz dist/*.zip --target "$GITHUB_SHA" --title "$VERSION" --notes-file notes.md
